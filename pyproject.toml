[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nlp-group-gradientes-backpropagation"
version = "0.1.0"
description = "Notebooks e módulos de estudo sobre PyTorch: autograd, backpropagation e embeddings"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Heitor Dias Ribeiro", email = "heitordias@discente.ufg.br" },
]
keywords = ["pytorch", "autograd", "backpropagation", "gradient-descent", "embeddings", "word2vec", "nlp", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "graphviz>=0.20",
    "torchviz>=0.0.2",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.urls]
Repository = "https://github.com/h3it-dias/NLP_Group_Gradientes_Backpropagation"

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["pytorch_redes", "embeddings", "micrograd"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
